# CDS-130653 svc 04 -- THE MAIN PROOF (case 14).
#
# k8s-tpl-hook has NO values file in git. A PreHook with action TemplateManifest
# writes templates/values.yaml at runtime.
#
# BEFORE the fix: the stage's only fetch runs inside RenderingStep, which is BEFORE
#   this hook. Auto-discovery finds nothing, fetchedPaths is empty, saveRenderingStepOutput
#   returns early, manifests.toTemplate stays empty and manifests.overrides stays empty
#   (nothing declared). willRunTemplating() -> false. Templating never runs, deployment.yaml
#   stays a raw go-template, k8s dry-run FAILS on `replicas: {{ .Values.replicaCount }}`.
#
# AFTER the fix: the pre-hook runs, THEN TemplatingStep's own fetch runs and discovers
#   templates/values.yaml, publishes it, overrides/toTemplate get it, the gate passes and
#   templating renders proof=HOOK-CREATED-VALUES / replicas=11 / image=nginx:1.27 / port=8443.
#
# Replace every <YOUR_...> placeholder.
service:
  uses: kubernetes
  with:
    manifests:
      sources:
        - id: k8s_manifest
          uses: k8s
          with:
            store:
              uses: github
              with:
                connector: <YOUR_GIT_CONNECTOR>
                type: branch
                branch: <YOUR_BRANCH>
                repo: <YOUR_REPO>
                paths:
                  - CDS-130653-repro/fixtures/k8s-tpl-hook
            # Nothing declared. The hook below is the ONLY source of values.
            values: []
    hooks:
      - identifier: createValuesFile
        type: PreHook
        actions:
          - TemplateManifest
        storeType: inline
        store:
          content: |
            set -eux
            # Locate the manifest dir the fetch/templating plugins will read. Do not
            # hardcode /harness/<repo>/... -- the checkout root differs per runtime.
            d=$(find /harness -type d -path '*CDS-130653-repro/fixtures/k8s-tpl-hook/templates' | head -1)
            test -n "$d"
            cat > "$d/values.yaml" <<'VALS'
            proof: HOOK-CREATED-VALUES
            replicaCount: 11
            image: nginx:1.27
            port: 8443
            VALS
            echo "pre-hook wrote $d/values.yaml"
            cat "$d/values.yaml"
        order: 1
