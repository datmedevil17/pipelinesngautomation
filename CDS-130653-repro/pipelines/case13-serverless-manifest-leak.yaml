# CDS-130653 repro - CASE 13   [GROUP C]   *** REAL BEFORE-FIX DEFECT ***
# Swimlane    : serverless (harness-rendering image)
# Service     : services/10-serverless-values.yaml   (same as case 05)
# New image?  : YES for the AFTER behaviour; BEFORE symptom is visible today.
#
# harness-rendering returns a file whenever inputs.ContainsHarnessExpression is
# true. serverlessUnified.yaml carries expressions, so it comes back - as a
# MANIFEST. It also returns OverridesPaths files, which are genuine values. Flat
# map, one bucket, and templates/templating/serverless.yaml feeds `overrides`
# into PLUGIN_VALUES_PATH.
#
# BEFORE FIX (predicted): step 1's leak check shows serverlessUnified.yaml inside
#   overrides. The serverless-template plugin merges the manifest's own top-level
#   keys (service/region/stage/provider/functions) in as values.
# AFTER FIX (expected): leak check prints "clean". harness-rendering publishes
#   serverlessUnified.yaml under HARNESS_FILES_TO_RENDER only, and
#   values-declared.yaml under both keys.
#
# fixtures/serverless/manifest-no-expression.yaml deliberately has no expression,
# so it should NOT appear in any of the three lists. Check that too.

pipeline:
  clone:
    disabled: true

  stages:
    - name: Serverless manifest leaks into overrides
      id: case13
      service: <YOUR_SERVICE_ID>   # services/10-serverless-values.yaml
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:

        # -------------------------------------------------------------------
        # STEP 1 -- evidence. Reads the three manifest path lists as env vars.
        # serviceOutput.manifests.* resolves at service-resolution time, so this
        # step can run first and still see what the gate will see.
        # -------------------------------------------------------------------
        - name: evidence
          id: evidence
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            env:
              OVERRIDES: ${{serviceOutput.manifests.overrides}}
              TO_TEMPLATE: ${{serviceOutput.manifests.toTemplate}}
              TO_RENDER: ${{serviceOutput.manifests.toRender}}
              PRIMARY_TYPE: ${{serviceOutput.manifests.primary.uses}}
            script: |-
              set -u
              echo "primary type : $PRIMARY_TYPE"
              echo "overrides    : [$OVERRIDES]"
              echo "toTemplate   : [$TO_TEMPLATE]"
              echo "toRender     : [$TO_RENDER]"
              echo

              # An unresolved expression comes back empty, as the string "null", or as
              # the literal expression text. Never write the expression delimiters in a
              # script body -- Harness resolves them before sh sees this file, so the
              # literal is detected by the inner path only.
              blank() {
                case "$1" in
                  ""|null|null,*)             return 0 ;;
                  *serviceOutput.manifests*)  return 0 ;;
                  *)                          return 1 ;;
                esac
              }
              if blank "$OVERRIDES";  then ov=empty; else ov=set; fi
              if blank "$TO_TEMPLATE"; then tt=empty; else tt=set; fi
              if blank "$TO_RENDER";   then tr=empty; else tr=set; fi
              echo "overrides=$ov  toTemplate=$tt  toRender=$tr"
              echo
              echo "===== leak check: is serverlessUnified.yaml in overrides? ====="
              case "$OVERRIDES" in
                *serverlessUnified.yaml*)
                  echo "  LEAKED -- serverlessUnified.yaml is a manifest, not an overrides file."
                  echo "  The templating template feeds manifests.overrides straight into"
                  echo "  its PLUGIN_*_PATH input, so this manifest is about to be handed"
                  echo "  to the templating plugin as if it were a values file."
                  echo "  THIS IS THE BEFORE-FIX SYMPTOM."
                  ;;
                *) echo "  clean -- serverlessUnified.yaml is not in overrides." ;;
              esac
              echo
              echo "===== is it in toRender (where it belongs)? ====="
              case "$TO_RENDER" in
                *serverlessUnified.yaml*) echo "  yes, toRender carries it. correct." ;;
                *)       echo "  no. toRender=[$TO_RENDER]" ;;
              esac
              echo
              echo "===== manifest-no-expression.yaml must be absent from all 3 ====="
              case "$OVERRIDES$TO_TEMPLATE$TO_RENDER" in
                *manifest-no-expression*) echo "  UNEXPECTED: it is listed somewhere." ;;
                *) echo "  correct - harness-rendering never returned it." ;;
              esac
              echo

        # LOAD-BEARING, same reason as k8sDryRunStep in the other cases.
        # Use serverlessPackageStep 1.1.0 -- 1.1.1 has a broken nested-JEXL `image:`
        # default that yields InvalidImageName.
        - name: Package
          id: packagestep
          template:
            uses: serverlessPackageStep
            with:
              pre_exec_cmd: d=$(find /harness -type f -name package.json -path '*CDS-130653-repro*' -not -path '*/node_modules/*' 2>/dev/null | head -1) && cd "$(dirname "$d")" && npm install
              image: harnessdev/serverless-plugin:0.0.2-nodejs24.x-1.151.0
              container_registry: account.harnessImage

        # -------------------------------------------------------------------
        # STEP 3 -- assert the rendered manifest. MUST come after the dry-run step:
        # the injected Rendering/Templating steps hang off the step that consumes
        # runtime.manifestPath, so nothing is rendered before it.
        # -------------------------------------------------------------------
        - name: assert
          id: assert
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -u
              fail=0
              MANIFEST=serverlessUnified.yaml

              echo "===== every $MANIFEST in the workspace ====="
              found=0
              for f in $(find /harness -type f -name "$MANIFEST" 2>/dev/null | sort); do
                found=1
                if grep -q '{{' "$f"; then state="RAW (go-template left)"; else state="RENDERED"; fi
                echo "  [$state] $f"
              done
              if [ "$found" -eq 0 ]; then
                echo "  (none)"
                echo "===== /harness tree ====="
                find /harness -maxdepth 7 2>/dev/null | sort | sed 's/^/    /'
                echo "FATAL: no $MANIFEST anywhere."
                exit 2
              fi

              m=""
              for f in $(find /harness -type f -name "$MANIFEST" 2>/dev/null | sort); do
                if ! grep -q '{{' "$f"; then m="$f"; break; fi
              done
              if [ -z "$m" ]; then
                m=$(find /harness -type f -name "$MANIFEST" 2>/dev/null | sort | head -1)
                echo
                echo "WARNING: no rendered copy exists. Asserting against the raw $m, so"
                echo "         every assert below will fail. Templating did not run --"
                echo "         re-read step 1's evidence."
              fi

              echo
              echo "manifest under test: $m"
              echo "===== contents ====="
              cat "$m"
              echo

              val() { sed -n "s/^[[:space:]]*-\{0,1\}[[:space:]]*$1:[[:space:]]*//p" "$m" | head -1 | tr -d "'\""; }
              chk() {
                if [ "$3" = "$2" ]; then printf '  PASS  %-22s %s\n' "$1" "$3"
                else printf '  FAIL  %-22s got=[%s] want=[%s]\n' "$1" "$3" "$2"; fail=1; fi
              }

              echo "===== asserts ====="
              chk "service" "cds130653-svc" "$(val service)"
              chk "region" "us-east-1" "$(val region)"
              chk "stage" "qa" "$(val stage)"

              echo
              if grep -q '<no value>' "$m"; then
                echo "  FAIL  unresolved <no value> left -- templating ran but the values"
                echo "        file it was handed did not supply every key."
                grep -n '<no value>' "$m" | sed 's/^/          /'
                fail=1
              else
                echo "  PASS  no <no value> left"
              fi
              exit $fail

      runtime:
        kubernetes:
          namespace: <YOUR_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 20m
