# CDS-132909 repro. Swap service/env/infra ids for ones that exist in your account.
# Run 3 (literal items) is below. For the real repro (Run 2) replace items with:
#   items: ${{pipeline.stages.S1.steps.K8sRolling.output.podIps}}
pipeline:
  clone:
    enabled: false
  id: cds132909repro
  name: CDS-132909 repeat over podIps
  stages:
    - id: S1
      name: S1
      environment:
        id: CDPAutomationEnvxxZQxXpHC0
        deploy-to: CDPAutomationInfraxhEfGl4Omy
      service:
        id: CDS132909Svc
        type: kubernetes
      runtime:
        cloud: {}
      on-failure:
        - action: stage-rollback
          errors:
            - all
      rollback:
        - id: rollbackRolloutDeployment
          name: Rollback Rollout Deployment
          template:
            uses: k8sRollingRollbackStep
            with:
              pruning: false
          timeout: 10m
      steps:
        - id: K8sRolling
          name: K8sRolling
          template:
            uses: k8sRollingDeployStep
            with:
              skip_dry_run: true
          timeout: 10m
        - id: Print_pod_ip
          name: Print pod ip
          run:
            script: echo "${{repeat.item}}"
            shell: bash
          strategy:
            repeat:
              items: ["10.0.0.1", "10.0.0.2"]
          timeout: 10m
        - id: finalDelete
          name: finalDelete
          on-failure:
            - action: success
              errors:
                - all
          template:
            uses: k8sDeleteStep
            with:
              delete_namespaces: false
              release: ${{infra.releaseName}}
              select_delete_resources: release name
          timeout: 10m
