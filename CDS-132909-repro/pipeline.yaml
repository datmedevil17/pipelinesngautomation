pipeline:
  clone:
    enabled: false
  id: cds132909repro
  name: CDS132909 repro
  delegate:
    - myrunner
  stages:
    - id: S1
      name: S1
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      service:
        items:
          - cds132909_svc
      runtime: delegate
      platform:
        os: linux
        arch: arm64
      steps:
        - id: K8sRolling
          name: K8sRolling
          template:
            uses: k8sRollingDeployStep
            with:
              skip_dry_run: true
          timeout: 10m
        # RUN A (control): literal items -> should pass
        - id: Print_pod_ip
          name: Print pod ip
          run:
            script: echo "${{repeat.item}}"
            shell: bash
          strategy:
            repeat:
              items: ["10.0.0.1", "10.0.0.2"]
          timeout: 10m
        # RUN B (bug): swap items above for ->
        #   items: ${{pipeline.stages.S1.steps.K8sRolling.output.podIps}}
        # RUN C (workaround): single step, no strategy
        - id: Print_pod_ips_loop
          name: Print pod ips loop
          run:
            script: |
              for ip in $(echo '${{pipeline.stages.S1.steps.K8sRolling.output.podIps}}' | tr -d '[]," '  | tr ';' ' '); do echo "pod ip: $ip"; done
            shell: bash
          timeout: 10m
        - id: finalDelete
          name: finalDelete
          on-failure:
            - action: success
              errors:
                - all
          template:
            uses: k8sDeleteStep
            with:
              delete_namespaces: false
              release: ${{infra.releaseName}}
              select_delete_resources: release name
          timeout: 10m
