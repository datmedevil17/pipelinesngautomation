apiVersion: apps/v1
kind: Deployment
metadata:
  name: acr-pull-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acr-pull-demo
  template:
    metadata:
      labels:
        app: acr-pull-demo
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: app
          image: <+artifacts.primary.image>
