# CDS-130653 -- variant B: the GREEN BASELINE, not a repro.
#
# This directory ships templates/values.yaml in git. The k8s fetch plugin
# auto-discovers that name, so the values file is fetched, lands in
# manifests.overrides/toTemplate/toRender, the templating gate opens, and this
# manifest is rendered into /harness/.harness/.k8s/k8s-template-*/ before K8s
# Dry Run reads it. Verified on 2026-09-09: all four asserts pass.
#
# Keep it as the control. It proves the happy path works, so when variant A
# (../manifests, values.yaml written by a pre-hook at runtime) fails, the
# difference is WHEN the values file appears -- after the single fetch -- and
# not something broken in templating itself.
#
# One thing this run did show: overrides, toTemplate and toRender came back
# byte-identical, each holding only values.yaml. That is
# mergePathsWithManifestOutput's union -- the manager cannot tell the two roles
# apart, which is what the plugin-side HARNESS_FILES_TO_TEMPLATE /
# HARNESS_FILES_TO_RENDER keys fix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds130653
  labels:
    proof: {{ .Values.proof }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cds130653
  template:
    metadata:
      labels:
        app: cds130653
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
