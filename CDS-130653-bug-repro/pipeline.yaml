# CDS-130653 bug repro -- the whole ticket in one run.
#
# Swimlane   : kubernetes. No values file in git; a TemplateManifest pre-hook
#              writes manifests/templates/values.yaml at runtime.
# Service    : CDS-130653-bug-repro/service.yaml
# New image? : NO. This is a manager-side bug, observable with today's images.
#
# TIMELINE BEFORE THE FIX
#   1. RenderingStep fetch runs      -> no values file on disk yet -> returns nothing
#   2. saveRenderingStepOutput sees an empty path list and returns an empty map,
#      so manifests.overrides / toTemplate / toRender all stay EMPTY
#   3. TemplatingStep link 1 runs the pre-hook, which CREATES templates/values.yaml
#   4. handleHookResponses DISCARDS the hook's output vars
#   5. willRunTemplating() reads the stale, empty toTemplate -> GATE CLOSES
#   6. templating never runs, deployment.yaml keeps its {{ }}
#   7. dry-run cannot parse a go-template, warns "no valid files found", and
#      still reports success -- so only the assert step catches it
#
# WHAT YOU SHOULD SEE (before the fix)
#   - step `evidence`  -> overrides=empty  toTemplate=empty  toRender=empty
#   - the stage's log tabs show   createValuesFile -> manifest-templating
#     with NO `templating-fetch-files` tab between them
#   - `Dry Run` does NOT hard-fail. A raw go-template is not valid YAML, so the
#     plugin skips the file and still reports success:
#         [WARNING] There were no valid files found in the at [[.../deployment.yaml]]
#         [INFO] K8s Dry Run execution successfully finished
#     That warning IS the repro. The bug is silent: the stage goes green and
#     nothing is ever applied.
#   - step `assert` then prints "BUG PRESENT: no rendered copy" and 4 FAILs, which
#     is what actually turns the run red.
#
# WHAT YOU SHOULD SEE (after the fix)
#   - a new log tab `templating-fetch-files` appears BETWEEN the pre-hook and
#     manifest-templating: TemplatingStep now does its own fetch
#   - that fetch discovers the hook-written values.yaml, applyFetchOutput fills
#     the lists, the gate opens via hasFilesToTemplate
#   - Dry Run passes and `assert` prints 4/4 PASS plus "no <no value> left"
#
# BEFORE RUNNING
#   1. Commit and push CDS-130653-bug-repro/ -- the pipeline fetches from git,
#      not from your working copy.
#   2. Create the service from service.yaml (fill in <YOUR_GIT_CONNECTOR>).
#   3. Replace every <YOUR_...> placeholder below.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-130653 pre-hook values repro
      id: cds130653repro
      service: <YOUR_SERVICE_ID>
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:

        # ===================================================================
        # STEP 1 -- evidence. Reads the three manifest path lists as env vars.
        # serviceOutput.manifests.* resolves at service-resolution time, so this
        # step can run first and still see exactly what the gate will see.
        # This step alone diagnoses the bug and runs even though Dry Run fails.
        # ===================================================================
        - name: evidence
          id: evidence
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            env:
              OVERRIDES: ${{serviceOutput.manifests.overrides}}
              TO_TEMPLATE: ${{serviceOutput.manifests.toTemplate}}
              TO_RENDER: ${{serviceOutput.manifests.toRender}}
              PRIMARY_TYPE: ${{serviceOutput.manifests.primary.uses}}
            script: |-
              set -u
              echo "primary type : $PRIMARY_TYPE"
              echo "overrides    : [$OVERRIDES]"
              echo "toTemplate   : [$TO_TEMPLATE]"
              echo "toRender     : [$TO_RENDER]"
              echo

              # Three outcomes, and they are NOT the same thing:
              #   unresolved -> Harness never substituted the expression, so the
              #                 literal text reached sh. This says nothing about
              #                 the gate; the evidence is simply unavailable here.
              #   empty      -> resolved, and the list really is empty.
              #   set        -> resolved and populated.
              # Never write the expression delimiters in a script body: Harness
              # resolves them before sh sees this file, so the literal is detected
              # by the inner path only.
              classify() {
                case "$1" in
                  *serviceOutput.manifests*)  echo unresolved ;;
                  ""|null|null,*)             echo empty ;;
                  *)                          echo set ;;
                esac
              }
              ov=$(classify "$OVERRIDES")
              tt=$(classify "$TO_TEMPLATE")
              tr=$(classify "$TO_RENDER")
              echo "overrides=$ov  toTemplate=$tt  toRender=$tr"
              echo
              case "$ov$tt$tr" in
                *unresolved*)
                  echo "INCONCLUSIVE: serviceOutput.manifests.* did not resolve in this"
                  echo "              context, so this step cannot see the gate's input."
                  echo "              Judge the run by the two signals that always work:"
                  echo "                a) does the stage have a manifest-templating log tab?"
                  echo "                b) does K8s Dry Run print"
                  echo "                   'There were no valid files found' ?"
                  echo "              (b) means the manifest was STILL a raw go-template"
                  echo "              when dry-run read it -- templating never rendered it."
                  ;;
                emptyemptyempty|*empty*)
                  echo "BUG PRESENT: nothing to template, so the gate closes and"
                  echo "             manifest-templating is skipped -- even though the"
                  echo "             pre-hook creates a values file before it."
                  ;;
                *)
                  echo "gate will pass: the templating step has something to work with."
                  ;;
              esac
              echo
              echo "===== is the hook-written values file on disk yet? ====="
              find /harness -type f -name values.yaml \
                \( -path '*CDS-130653-bug-repro/*' -o -path '*k8s-tpl-hook/*' \) \
                2>/dev/null | sort -u | sed 's/^/  /'
              echo "(this step runs before the pre-hook, so 'nothing listed' here is"
              echo " expected. The point is that the LISTS above are empty even though"
              echo " the file DOES exist by the time templating is decided.)"

        # LOAD-BEARING. The injected Rendering/Templating steps hang off a step
        # that consumes runtime.manifestPath; k8sDryRunStep's `manifests` input
        # defaults to exactly that. Dry run renders and validates without
        # touching any workload.
        - name: Dry Run
          id: dryrun
          template:
            uses: k8sDryRunStep

        # ===================================================================
        # STEP 3 -- assert the rendered manifest. MUST come after the dry-run
        # step: the injected Rendering/Templating steps hang off the step that
        # consumes runtime.manifestPath, so nothing is rendered before it.
        # ===================================================================
        - name: assert
          id: assert
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -u
              fail=0

              # Scope every search to the repro's own manifest dir. The whole repo
              # is checked out under /harness/<n>/, so a bare
              # `find /harness -name deployment.yaml` also matches every other
              # fixture in the repo and will happily assert against the wrong file.
              #
              # Two patterns, so this works with either service:
              #   CDS-130653-bug-repro/manifests            (this folder)
              #   CDS-130653-repro/fixtures/k8s-tpl-hook    (the 16-case kit)
              # One find with quoted -path patterns. An unquoted list in a `for`
              # loop would be pathname-expanded against the CWD and could silently
              # search the wrong thing.
              MANIFEST=deployment.yaml

              findall() {
                find /harness -type f -name "$1" \
                  \( -path '*CDS-130653-bug-repro/*' -o -path '*k8s-tpl-hook/*' \) \
                  2>/dev/null | sort -u
              }

              echo "===== did the pre-hook write its values file? ====="
              vf=$(findall values.yaml)
              if [ -z "$vf" ]; then
                echo "  NOT FOUND -- the pre-hook did not run, or wrote elsewhere."
              else
                for v in $vf; do echo "  $v"; sed 's/^/      /' "$v"; done
              fi
              echo

              echo "===== every $MANIFEST inside this repro ====="
              all=$(findall "$MANIFEST")
              if [ -z "$all" ]; then
                echo "  (none)"
                echo "===== repro tree ====="
                find /harness \
                  \( -path '*CDS-130653-bug-repro/*' -o -path '*k8s-tpl-hook/*' \) \
                  2>/dev/null | sort -u | sed 's/^/    /'
                echo "FATAL: no $MANIFEST under the repro dirs."
                echo "       Widen the -path patterns in findall() to whatever your"
                echo "       service fetches."
                exit 2
              fi
              for f in $all; do
                if grep -q '{{' "$f"; then state="RAW (go-template left)"; else state="RENDERED"; fi
                echo "  [$state] $f"
              done

              m=""
              for f in $all; do
                if ! grep -q '{{' "$f"; then m="$f"; break; fi
              done
              if [ -z "$m" ]; then
                m=$(echo "$all" | head -1)
                echo
                echo "BUG PRESENT: no rendered copy of this repro's manifest exists."
                echo "             Templating did not run. Asserting against the raw"
                echo "             $m, so every assert below will fail by design."
              fi

              echo
              echo "manifest under test: $m"
              echo "===== contents ====="
              cat "$m"
              echo

              val() { sed -n "s/^[[:space:]]*-\{0,1\}[[:space:]]*$1:[[:space:]]*//p" "$m" | head -1 | tr -d "'\""; }
              chk() {
                if [ "$3" = "$2" ]; then printf '  PASS  %-22s %s\n' "$1" "$3"
                else printf '  FAIL  %-22s got=[%s] want=[%s]\n' "$1" "$3" "$2"; fail=1; fi
              }

              # Two variants ship in this folder and they carry different values.
              # Pick the expectations from whichever manifest actually got fetched.
              case "$m" in
                *manifests-with-values*)
                  echo "variant B: values.yaml comes from git (no hook involved)"
                  w_proof=GIT-VALUES; w_rep=7; w_img=nginx:1.25; w_port=9090 ;;
                *)
                  echo "variant A: values.yaml is written by the pre-hook at runtime"
                  w_proof=HOOK-CREATED-VALUES; w_rep=11; w_img=nginx:1.27; w_port=8443 ;;
              esac
              echo
              echo "===== asserts ====="
              chk "proof" "$w_proof" "$(val proof)"
              chk "replicas" "$w_rep" "$(val replicas)"
              chk "image" "$w_img" "$(val image)"
              chk "containerPort" "$w_port" "$(val containerPort)"

              echo
              if grep -q '<no value>' "$m"; then
                echo "  FAIL  unresolved <no value> left -- templating ran but the values"
                echo "        file it was handed did not supply every key."
                grep -n '<no value>' "$m" | sed 's/^/          /'
                fail=1
              else
                echo "  PASS  no <no value> left"
              fi
              exit $fail

      runtime:
        kubernetes:
          namespace: <YOUR_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 20m
