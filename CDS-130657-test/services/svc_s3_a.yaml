service:
  name: svc_s3_a
  identifier: svc_s3_a
  serviceDefinition:
    type: NativeHelm
    spec:
      manifests:
        - manifest:
            identifier: myChart
            type: HelmChart
            spec:
              store:
                type: S3
                spec:
                  connectorRef: aws_s3_connector
                  region: us-east-1
                  bucketName: my-helm-bucket
                  folderPath: charts
              chartName: hello-world
              chartVersion: 0.1.0
              helmVersion: V3
              skipResourceVersioning: false
  gitOpsEnabled: false
