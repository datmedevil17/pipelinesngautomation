apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.name}}
  template:
    metadata:
      labels:
        app: {{.Values.name}}
    spec:
      containers:
        - name: {{.Values.name}}
          image: hashicorp/http-echo:latest
          args:
            - -text={{.Values.name}}
            - -listen=:5000
          ports:
            - containerPort: 5000
