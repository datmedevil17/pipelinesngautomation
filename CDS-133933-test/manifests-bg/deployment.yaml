apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds133933
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cds133933
      harness.io/color: ${harnessColor}
  template:
    metadata:
      labels:
        app: cds133933
        harness.io/color: ${harnessColor}
    spec:
      containers:
        - name: cds133933
          image: hashicorp/http-echo:latest
          args:
            - -text=v1
            - -listen=:5000
          ports:
            - containerPort: 5000
