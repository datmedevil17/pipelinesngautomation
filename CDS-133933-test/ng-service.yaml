# Classic NG service — self-contained CustomRemote manifest (no git push
# needed). Deploys Deployment + Service + a VirtualService that ALREADY has
# hosts/gateways/http.timeout/retries set, matching the ticket's "manifest's
# existing VirtualService" scenario.
service:
  name: cds133933-svc
  identifier: cds133933svc
  orgIdentifier: <YOUR_ORG>
  projectIdentifier: <YOUR_PROJECT>
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: m1
            type: K8sManifest
            spec:
              store:
                type: CustomRemote
                spec:
                  filePath: manifests/
                  extractionScript: |-
                    mkdir -p manifests
                    cat <<'DEPLOYMENT' > manifests/deployment.yaml
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: {{.Values.name}}
                    spec:
                      replicas: 1
                      selector:
                        matchLabels:
                          app: {{.Values.name}}
                      template:
                        metadata:
                          labels:
                            app: {{.Values.name}}
                        spec:
                          containers:
                            - name: {{.Values.name}}
                              image: hashicorp/http-echo:latest
                              args:
                                - -text={{.Values.name}}
                                - -listen=:5000
                              ports:
                                - containerPort: 5000
                    DEPLOYMENT
                    cat <<'SERVICE' > manifests/service.yaml
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: {{.Values.name}}-svc
                    spec:
                      selector:
                        app: {{.Values.name}}
                      ports:
                        - port: 80
                          targetPort: 5000
                    SERVICE
                    cat <<'VSEOF' > manifests/virtualservice.yaml
                    apiVersion: networking.istio.io/v1beta1
                    kind: VirtualService
                    metadata:
                      name: trafficshift-vs
                      annotations:
                        harness.io/direct-apply: "true"
                    spec:
                      hosts:
                        - trafficshift.example.com
                      gateways:
                        - customer-gateway
                      http:
                        - name: route1
                          timeout: 30s
                          retries:
                            attempts: 3
                          route:
                            - destination:
                                host: {{.Values.name}}-svc
                              weight: 100
                    VSEOF
                  commandPath: manifests/
            overridePaths: []
      variables:
        - name: name
          type: String
          value: cds133933
