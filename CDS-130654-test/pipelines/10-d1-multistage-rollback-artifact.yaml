pipeline:
  name: CDS130654 D1 multi-stage rollbackArtifact
  id: cds130654_d1_multistage
  clone:
    disabled: true
  stages:
    - name: Stage A
      id: stageA
      service:
        type: kubernetes
        items:
          - cds130654_d1_stage_a
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      timeout: 20m
      steps:
        - name: Echo artifact
          id: echoArtifact
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              echo "primary.image = <+artifacts.primary.image>"
              echo "primary.tag   = <+artifacts.primary.tag>"
              echo "rollbackArtifact.tag = <+rollbackArtifact.tag>"
              echo "rollback.primary.tag = <+rollback.artifacts.primary.tag>"
          timeout: 5m
        - name: Rolling Deploy
          id: rollingDeploy
          template:
            uses: k8sRollingDeployStep
      on-failure:
        - errors:
            - all
          action: abort
    - name: Stage B
      id: stageB
      service:
        type: kubernetes
        items:
          - cds130654_d1_stage_b
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      timeout: 20m
      steps:
        - name: Echo artifact
          id: echoArtifact
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              echo "primary.image = <+artifacts.primary.image>"
              echo "primary.tag   = <+artifacts.primary.tag>"
              echo "rollbackArtifact.tag = <+rollbackArtifact.tag>"
              echo "rollback.primary.tag = <+rollback.artifacts.primary.tag>"
          timeout: 5m
        - name: Rolling Deploy
          id: rollingDeploy
          template:
            uses: k8sRollingDeployStep
      on-failure:
        - errors:
            - all
          action: abort
