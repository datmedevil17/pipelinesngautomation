pipeline:
  name: CDS130654 A3 lastPublished version family
  id: cds130654_a3_lastpublished_version
  clone:
    disabled: true
  stages:
    - name: Deploy
      id: deploy
      service:
        type: kubernetes
        items:
          - cds130654_a3_version_family
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      timeout: 20m
      steps:
        - name: Echo artifact
          id: echoArtifact
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              echo "primary.version = <+artifacts.primary.version>"
              echo "primary.image = <+artifacts.primary.image>"
              echo "primary.tag   = <+artifacts.primary.tag>"
          timeout: 5m
      on-failure:
        - errors:
            - all
          action: abort
