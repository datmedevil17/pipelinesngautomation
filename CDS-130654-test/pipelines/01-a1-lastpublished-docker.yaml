pipeline:
  name: CDS130654 A1 lastPublished docker primary
  id: cds130654_a1_lastpublished_docker
  clone:
    disabled: true
  stages:
    - name: Deploy
      id: deploy
      service:
        type: kubernetes
        items:
          - cds130654_a1_lastpub_docker
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      timeout: 20m
      steps:
        - name: Echo artifact
          id: echoArtifact
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              echo "primary.image = <+artifacts.primary.image>"
              echo "primary.tag   = <+artifacts.primary.tag>"
          timeout: 5m
        - name: Rolling Deploy
          id: rollingDeploy
          template:
            uses: k8sRollingDeployStep
      on-failure:
        - errors:
            - all
          action: abort
