pipeline:
  name: CDS130654 B3 lastSuccessfulDeployed skips failed run
  id: cds130654_b3_lsd_skip_failed
  clone:
    disabled: true
  stages:
    - name: Deploy
      id: deploy
      service:
        type: kubernetes
        items:
          - cds130654_b3_lsd_skip_failed
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      timeout: 20m
      steps:
        - name: Echo artifact
          id: echoArtifact
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              echo "primary.image = <+artifacts.primary.image>"
              echo "primary.tag   = <+artifacts.primary.tag>"
          timeout: 5m
        - name: Rolling Deploy
          id: rollingDeploy
          template:
            uses: k8sRollingDeployStep
        - name: Fail if tag is 1.27.0
          id: failIfV2
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              T="<+artifacts.primary.tag>"
              echo "tag=$T"
              if [ "$T" = "1.27.0" ]; then echo "intentional failure for B3"; exit 1; fi
          timeout: 5m
      on-failure:
        - errors:
            - all
          action: abort
