service: serverless-minimal-fixture
frameworkVersion: '3.39.0'

provider:
  name: aws
  region: us-east-1
  stage: dev
  memorySize: 256
  ecr:
    images:
      appimage:
        uri: <+artifact.image>

functions:
  hello:
    image: appimage
    events:
      - httpApi:
          path: /hello
          method: get
