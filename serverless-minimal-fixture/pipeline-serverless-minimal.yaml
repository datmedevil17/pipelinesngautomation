
pipeline:
  clone:
    disabled: true

  stages:
    - name: Serverless minimal deploy
      id: serverlessminimaldeploy
      service: sls_github_ecr_llale
      environment:
        id: ServerlessEnv_ifWGy
        deploy-to: infra_VVjIq
      steps:

        - name: npm install
          id: npmInstall
          run:
            container:
              image: node:20-alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -eu
              d=$(find "${HARNESS_WORKSPACE:-/harness}" -type f -name package.json -path '*serverless*' -not -path '*/node_modules/*' 2>/dev/null | head -1)
              cd "$(dirname "$d")" && npm install

        - name: serverless deploy
          id: serverlessDeploy
          template:
            uses: serverlessDeployAction@1.0.2
            with:
              log_level: debug

      runtime:
        kubernetes:
          namespace: do-not-delete-serverless
          connector: account.cdautomationtest
          automount-service-token: true
          pull: always
      timeout: 15m
