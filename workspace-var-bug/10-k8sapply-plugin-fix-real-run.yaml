pipeline:
  stages:
  - name: Stage
    id: stage
    service: <your-k8s-manifest-service-id>
    environment:
      id: <your-cd-environment-id>
      deploy-to: <your-k8s-infra-id>
    steps:
    - id: seed_manifest
      name: Seed Relative Manifest
      run:
        container:
          image: library/alpine
          connector: account.harnessImage
        shell: sh
        script: |-
          echo "workspace => [$HARNESS_WORKSPACE]"
          mkdir -p "$HARNESS_WORKSPACE/manifests"
          cat > "$HARNESS_WORKSPACE/manifests/cm.yaml" <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: workspace-fix-check
          data:
            hello: world
          EOF
          echo "seeded file:"
          cat "$HARNESS_WORKSPACE/manifests/cm.yaml"
    - id: applystep
      name: Apply Manifests
      run:
        container:
          # Swap this tag: harnessdev/k8s-apply:0.0.2 (old, unfixed) vs your
          # locally built image from fix/CDS-130618-k8s-apply-workspace-resolution
          image: harnessdev/k8s-apply:0.0.2
          connector: account.harnessImage
        env:
          PLUGIN_KUBECONFIG_PATH: ${{infra.kube_config_path}}
          PLUGIN_NAMESPACE: ${{infra.namespace}}
          PLUGIN_MANIFEST_PATH: '["manifests"]'
          PLUGIN_HARNESS_WORKSPACE: ${{runtime.workspace}}
          PLUGIN_MANIFEST_ID: primary
          PLUGIN_EXECUTE_DRY_RUN: "true"
          PLUGIN_PRINT_MANIFESTS: "true"
          PLUGIN_LOG_LEVEL: debug
    runtime:
      kubernetes:
        namespace: default
        connector: connector_K8sCluster_local
    timeout: 10m
