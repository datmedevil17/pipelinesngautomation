pipeline:
  stages:
  - name: Stage
    id: stage
    service: <your-k8s-manifest-service-id>
    environment:
      id: <your-cd-environment-id>
      deploy-to: <your-k8s-infra-id>
    steps:
    - name: Apply Manifests
      id: applystep
      template:
        uses: k8sApplyAction@1.0.11
        with:
          # Give a RELATIVE path here (not an absolute one) — this overrides the
          # default ${{runtime.manifestPath}} and is the exact scenario the bug was about.
          # It must match wherever your manifest actually lands under the workspace
          # (e.g. the folder path you set on the service's manifest store).
          manifests:
            - <relative-path-to-your-manifest-folder>
          only_dry_run: true
          print_manifests: true
          log_level: debug
    runtime:
      kubernetes:
        namespace: default
        connector: connector_K8sCluster_local
    timeout: 10m
