pipeline:
  stages:
  - name: Stage
    id: stage
    service: <your-k8s-manifest-service-id>
    environment:
      id: <your-cd-environment-id>
      deploy-to: <your-k8s-infra-id>
    steps:
    - name: Apply Manifests
      id: applystep
      template:
        uses: k8sApplyAction@1.0.11
    runtime:
      kubernetes:
        namespace: default
        connector: connector_K8sCluster_local
    timeout: 10m
