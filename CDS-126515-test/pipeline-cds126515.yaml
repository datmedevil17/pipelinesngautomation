# CDS-126515 repro/verification -- a manifest source flagged optionalValuesYaml
# must not fail a deploy when its declared values file is missing on fetch.
#
# WHAT THIS PROVES
#   Two manifests on one service:
#     `k8s`             -- required values file (values-required.yaml), no flag
#     `values_optional` -- optionalValuesYaml: true, points at a file that is
#                          DELIBERATELY NEVER COMMITTED (values-optional.yaml)
#
#   Java tags the optional path into serviceOutput.manifests.optionalOverrides.
#   ci-manager templates forward it as PLUGIN_OPTIONAL_VALUES_PATH. The four Go
#   plugins (manifestPlugin/{helm,kubernetes}, kubernetes-plugin/{helm-template,
#   k8s-template}) drop any path in that list that doesn't exist on disk before
#   building the -f/-values argument list -- see availableValuesPaths() and
#   plugin_test.go::TestAvailableValuesPaths.
#
# BEFORE RUNNING
#   1. This repo (datmedevil17/test-test) is already pushed -- the pipeline
#      fetches from git, not your working copy. Re-push after any local edit.
#   2. Create the two-manifest service described in README.md.
#   3. Replace every <YOUR_...> placeholder below.
#
# EXPECTED
#   step 1: optionalOverrides contains only k8sValues/values-optional.yaml
#   step 2 (Dry Run): PASSES even though that file does not exist in git
#   step 3: required fields render correctly; optional field is cleanly
#           unsupplied (<no value>), not a failure

pipeline:
  clone:
    disabled: true

  stages:
    - name: K8s Optional Values
      id: k8soptionalvalues
      service: <YOUR_CDS126515_SERVICE_ID>
      environment:
        id: <YOUR_K8S_ENV_ID>
        deploy-to: <YOUR_K8S_INFRA_ID>
      steps:

        # ===================================================================
        # STEP 1 -- confirms Java tagged the right manifest as optional.
        # ===================================================================
        - name: CDS-126515 signal evidence
          id: signalevidence
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            env:
              OVERRIDES: ${{serviceOutput.manifests.overrides}}
              OPTIONAL_OVERRIDES: ${{serviceOutput.manifests.optionalOverrides}}
            script: |-
              set -u
              echo "overrides         : $OVERRIDES"
              echo "optionalOverrides : $OPTIONAL_OVERRIDES"
              echo

              blank() {
                case "$1" in
                  ""|null|null,*) return 0 ;;
                  *serviceOutput.manifests*) return 0 ;;
                  *) return 1 ;;
                esac
              }

              fail=0
              case "$OVERRIDES" in
                *values-required.yaml*) echo "  PASS  required file is declared in overrides" ;;
                *) echo "  FAIL  required file MISSING from overrides"; fail=1 ;;
              esac
              case "$OVERRIDES" in
                *values-optional.yaml*) echo "  PASS  optional file is declared in overrides" ;;
                *) echo "  FAIL  optional file MISSING from overrides"; fail=1 ;;
              esac
              if blank "$OPTIONAL_OVERRIDES"; then
                echo "  FAIL  optionalOverrides is EMPTY -- the optional flag never reached serviceOutput"
                fail=1
              else
                case "$OPTIONAL_OVERRIDES" in
                  *values-required.yaml*)
                    echo "  FAIL  the REQUIRED file leaked into optionalOverrides -- flag is not per-manifest"
                    fail=1 ;;
                  *values-optional.yaml*)
                    echo "  PASS  only the optional file is tagged in optionalOverrides" ;;
                  *)
                    echo "  FAIL  optionalOverrides is set but does not name values-optional.yaml"
                    fail=1 ;;
                esac
              fi
              echo
              if [ $fail -eq 0 ]; then echo "RESULT: PASS"; else echo "RESULT: FAIL"; fi
              exit $fail

        # ===================================================================
        # STEP 2 -- LOAD-BEARING and the actual repro/verification target.
        # values-optional.yaml does not exist in git. Before the fix (or if
        # PLUGIN_OPTIONAL_VALUES_PATH isn't wired through), this step FAILS
        # because the plugin passes a nonexistent file to -f/--values. After
        # the fix, it must PASS.
        # ===================================================================
        - name: Dry Run
          id: dryrun
          template:
            uses: k8sDryRunStep

        # ===================================================================
        # STEP 3 -- only reached once Dry Run passes.
        # ===================================================================
        - name: CDS-126515 rendered manifest
          id: rendered
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -u
              fail=0

              echo "===== every deployment.yaml in the workspace ====="
              found=0
              for f in $(find /harness -type f -name deployment.yaml 2>/dev/null | sort); do
                found=1
                if grep -q '{{' "$f"; then state="RAW (go-template left)"
                else state="RENDERED"; fi
                echo "  [$state] $f"
              done
              if [ "$found" -eq 0 ]; then
                echo "  (none)"
                exit 2
              fi

              m=""
              for f in $(find /harness -type f -name deployment.yaml 2>/dev/null | sort); do
                if ! grep -q '{{' "$f"; then m="$f"; break; fi
              done
              if [ -z "$m" ]; then
                m=$(find /harness -type f -name deployment.yaml 2>/dev/null | sort | head -1)
                echo "WARNING: nothing rendered. Asserting against raw $m."
              fi

              echo
              echo "manifest under test: $m"
              echo "===== contents ====="
              cat "$m"
              echo

              val() { sed -n "s/^[[:space:]]*-\{0,1\}[[:space:]]*$1:[[:space:]]*//p" "$m" | head -1 | tr -d "'\""; }
              chk() {
                if [ "$3" = "$2" ]; then printf '  PASS  %-24s %s\n' "$1" "$3"
                else printf '  FAIL  %-24s got=[%s] want=[%s]\n' "$1" "$3" "$2"; fail=1; fi
              }

              echo "===== required-file asserts (from values-required.yaml) ====="
              chk "appName"    "cds126515-k8s-required" "$(val name)"
              chk "replicas"   "2"                       "$(val replicas)"
              chk "image"      "nginx:1.25"              "$(val image)"
              chk "containerPort" "8080"                 "$(val containerPort)"

              echo
              echo "===== optional-file field must be cleanly unsupplied ====="
              flag=$(val optional-feature-flag)
              if [ -z "$flag" ] || [ "$flag" = "<no value>" ]; then
                echo "  PASS  optional-feature-flag is unsupplied [$flag] -- missing optional file skipped, not fatal"
              else
                echo "  INFO  optional-feature-flag has a value [$flag] -- values-optional.yaml must have been added to the repo"
              fi

              echo
              if [ "$fail" -eq 0 ]; then
                echo "RESULT: PASS -- required values applied, optional file's absence did not fail the deploy."
              else
                echo "RESULT: FAIL -- see step 1's verdict first."
              fi
              exit $fail

      runtime:
        kubernetes:
          namespace: do-not-delete-serverless
          connector: account.cdautomationtest
          automount-service-token: true
          pull: always
      timeout: 15m
