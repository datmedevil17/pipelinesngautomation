# Chart's OWN defaults. These are what render if the extra override
# values file (declared separately on the manifest's valuesPaths, see
# ../values/present.yaml) is missing and optionalValuesYaml skips it --
# Helm always falls back to its own values.yaml, unlike a raw K8s
# manifest which has no built-in defaults. That is expected, not a bug.
appName: chart-default
replicaCount: 1
image: busybox:latest
port: 80
featureFlag: chart-default-flag
