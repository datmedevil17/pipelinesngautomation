pipeline:
  clone:
    disabled: true

  stages:
    - name: Helm Service Optional Values
      id: helmserviceoptionalvalues
      service: <YOUR_GROUP3_SERVICE_ID>
      environment:
        id: environment_env_2a02
        deploy-to: infrastructure_kubernetes_5a5e
      steps:

        - name: signal evidence
          id: signalevidence
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            env:
              OVERRIDES: ${{serviceOutput.manifests.overrides}}
              OPTIONAL_OVERRIDES: ${{serviceOutput.manifests.optionalOverrides}}
            script: |-
              echo "overrides         : $OVERRIDES"
              echo "optionalOverrides : $OPTIONAL_OVERRIDES"

        - name: Render
          id: helmrender
          template:
            uses: k8sHelmTemplateAction
            with:
              output: /harness/rendered-helm.yaml
              print_manifest: true

        - name: rendered chart
          id: rendered
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              f=$(find /harness/rendered-helm.yaml -type f -name '*.yaml' 2>/dev/null | sort | head -1)
              if [ -z "$f" ]; then
                echo "no rendered file found under /harness/rendered-helm.yaml -- Render step likely failed. See its logs."
                exit 1
              fi
              echo "manifest: $f"
              echo "===== contents ====="
              cat "$f"

      runtime:
        kubernetes:
          namespace: do-not-delete-serverless
          connector: account.cdautomationtest
          automount-service-token: true
          pull: always
      timeout: 15m
