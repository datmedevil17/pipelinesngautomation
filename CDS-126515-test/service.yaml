service:
  name: cds126515_helm_optional_values_test
  identifier: cds126515_helm_optional_values_test
  orgIdentifier: <+input>
  projectIdentifier: <+input>
  serviceDefinition:
    type: NativeHelm
    spec:
      manifests:
        - manifest:
            identifier: chart
            type: HelmChart
            spec:
              store:
                type: Harness
                spec:
                  filePath:
                    - account:/cds126515-test/chart
              # Deliberately points at a file we will NOT upload to File Store.
              valuesPaths:
                - account:/cds126515-test/values-missing.yaml
              # This is the flag CDS-126515 adds support for in the Unified/V1 stack.
              # true  -> pipeline should still succeed, missing file silently skipped.
              # false (or remove this line) -> pipeline should FAIL at the fetch/render step.
              optionalValuesYaml: true
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              helmVersion: V3
      manifestConfigurations:
        primaryManifestRef: chart
