pipeline:
  name: cds126515_helm_optional_values_test
  id: cds126515_helm_optional_values_test
  stages:
    - name: deploy
      id: deploy
      service:
        items:
          - service_CDS_126515
      environment:
        id: <+input>
        deploy-to: <+input>
      runtime:
        kubernetes:
          namespace: <+input>
          connector: <+input>
      on-failure:
        errors: [all]
        action: stage-rollback
      timeout: 10m
      steps:
        - deploy:
            # NOTE: grab the exact "uses: helmDeployStep@x.y.z" version by dragging a
            # "Helm Deploy" step into a stage in Pipeline Studio and reading it off the
            # YAML tab (couldn't verify the version tag from local source, only the key shape).
            uses: helmDeployStep@1.0.0
            with:
              skipSteadyStateCheck: false
      rollback:
        - group:
            steps:
              - deploy:
                  uses: helmRollbackStep@1.0.0
                  with: {}
