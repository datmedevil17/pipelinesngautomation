# CDS-122512 -- K8s SteadyStateCheck hooks, case 13: one service, three hook
# phases (FetchFiles, TemplateManifest, SteadyStateCheck) on the same deploy.
# service: services/13-k8s-mixed-hook-phases.yaml.
# Regression guard for ServiceHooksStep.fetchHooksSweepingOutputForPhase --
# adding steady-state node IDs without an explicit branch could route
# POST_STEADY_STATE hooks through the FetchFiles pre-path sweeping output by
# accident.
# BEFORE fix: fetch + template stamps exist (already shipped per CDS-130653),
# steady-state stamps do not.
# AFTER fix: all four stamps exist (fetch, template, steady-pre, steady-post),
# each phase independent of the others.

pipeline:
  name: pipeline_cds122512_k8s_13_mixed_phases
  identifier: pipeline_cds122512_k8s_13_mixed_phases

  stages:
    - name: CDS-122512 - mixed hook phases regression
      id: mixedHookPhases
      service: service_k8s_13_mixed_hook_phases
      environment:
        id: environment_env_2a02
        deploy-to: infrastructure_kubernetes_5a5e
      steps:
        - name: Rolling Deploy
          id: deploy
          template:
            uses: k8sRollingDeployStep

        - name: assert
          id: assert
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -u
              fail=0
              for f in mixed-fetch mixed-template mixed-steady-pre mixed-steady-post; do
                if [ -f /harness/cds122512-k8s-$f.stamp ]; then
                  echo "PASS: $f stamp present"
                else
                  echo "FAIL: $f stamp missing"
                  fail=1
                fi
              done
              exit $fail
      runtime:
        kubernetes:
          namespace: default
          connector: connector_K8sCluster_local
          automount-service-token: true
          pull: always
      timeout: 15m
