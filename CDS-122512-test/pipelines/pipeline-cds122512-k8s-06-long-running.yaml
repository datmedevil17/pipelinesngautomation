# CDS-122512 -- K8s SteadyStateCheck hooks, case 6: long-running poll timing.
# service: services/07-k8s-long-running-hooks.yaml (points at k8s-slow/,
# readinessProbe initialDelaySeconds 60).
# BEFORE fix: no stamps. AFTER fix: both stamps exist, post - pre >= ~45s --
# proves the POST hook waits for the real steady-state poll, not fired early.

pipeline:
  name: pipeline_cds122512_k8s_06_long_running
  identifier: pipeline_cds122512_k8s_06_long_running

  stages:
    - name: CDS-122512 k8s - long-running poll timing
      id: longRunningTiming
      service: service_k8s_07_long_running_hooks
      environment:
        id: environment_env_2a02
        deploy-to: infrastructure_kubernetes_5a5e
      steps:
        - name: Rolling Deploy
          id: deploy
          template:
            uses: k8sRollingDeployStep

        - name: assert
          id: assert
          run:
            container:
              image: alpine
              connector: account.harnessImage
            shell: sh
            script: |-
              set -u
              fail=0
              if [ ! -f /harness/cds122512-k8s-timing-pre.stamp ] || [ ! -f /harness/cds122512-k8s-timing-post.stamp ]; then
                echo "FAIL: missing stamp(s)"; exit 1
              fi
              pre=$(cat /harness/cds122512-k8s-timing-pre.stamp)
              post=$(cat /harness/cds122512-k8s-timing-post.stamp)
              delta=$((post - pre))
              echo "pre=$pre post=$post delta=${delta}s"
              if [ "$delta" -ge 45 ]; then
                echo "PASS: post fired only after the ~60s readiness delay had elapsed"
              else
                echo "FAIL: delta too small -- POST likely fired without waiting for the poll"
                fail=1
              fi
              exit $fail
      runtime:
        kubernetes:
          namespace: default
          connector: connector_K8sCluster_local
          automount-service-token: true
          pull: always
      timeout: 15m
