# EcsServiceDefinition manifest == raw AWS CreateServiceRequest.
# loadBalancers points at the STAGE target group -- on a Blue/Green create,
# the new (green) service is only attached to stage, not prod, until the
# Swap Target Groups step runs. Replace <STAGE_TARGET_GROUP_ARN> below.
serviceName: cds131309-service
desiredCount: 1
launchType: FARGATE
networkConfiguration:
  awsvpcConfiguration:
    subnets:
      - <SUBNET_ID_1>
      - <SUBNET_ID_2>
    securityGroups:
      - <SECURITY_GROUP_ID>
    assignPublicIp: ENABLED
loadBalancers:
  - targetGroupArn: <STAGE_TARGET_GROUP_ARN>
    containerName: web
    containerPort: 80
