# EcsTaskDefinition manifest == raw AWS RegisterTaskDefinitionRequest.
# Values below (execution/task role ARNs, log group, cpu/mem, container name/port)
# are copied from this account's own known-working manifest set
# (PipelinesNgAutomation/ECS/blueGreen/RegisterTaskDefinitionRequest.yaml).
executionRoleArn: arn:aws:iam::479370281431:role/ecsTaskExecutionRole
taskRoleArn: arn:aws:iam::479370281431:role/ecsTaskExecutionRole
family: <+stage.variables.taskName>
networkMode: awsvpc
requiresCompatibilities:
  - FARGATE
cpu: "256"
memory: "512"
containerDefinitions:
  - name: nginx
    image: public.ecr.aws/nginx/nginx:latest
    essential: true
    # the base nginx image listens on port 80 by default -- the target
    # group's health check hits containerPort (8080), so rewrite nginx's
    # listen directive before starting it, or every task fails its health
    # check and gets killed (RolloutState stuck IN_PROGRESS, FailedTasks>0).
    command:
      - /bin/sh
      - -c
      - "sed -i 's/listen  *80;/listen 8080;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    portMappings:
      - containerPort: 8080
        hostPort: 8080
        protocol: tcp
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: "/aws/ecs/containerinsights/ecs-cluster-3/performance"
        awslogs-region: us-east-1
        awslogs-stream-prefix: ecs
