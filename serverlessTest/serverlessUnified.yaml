service: {{.Values.serviceName}}
frameworkVersion: '3.40.0'

provider:
  name: aws
  ecr:
    images:
      appimage:
        uri: 479370281431.dkr.ecr.us-east-1.amazonaws.com/todolist:latest

functions:
  currentTime:
    image: appimage
    events:
      - httpApi:
          path: /time
          method: get