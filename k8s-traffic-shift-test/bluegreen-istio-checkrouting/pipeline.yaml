# CDS-T15817 -- Blue-Green deploy + K8sTrafficRoutingConfig (Istio), then
# live routing verification, executed TWICE (pinned to v1, then v2).
# Legacy status: @Ignore("corrupted Istio setup") -- this scenario has never
# actually passed in the legacy suite either; the Istio infra it needs is
# documented broken independent of the general blocker in ../README.md.
#
# Distinct mechanics from Rolling: BG is a single all-or-nothing 0/100
# cutover (one Config step, no Inherit) rather than a two-step chain.
# k8sBlueGreenDeployStep has a built-in `traffic_shift: true` option that
# internally calls the same action with config_type hardcoded to `new`
# (confirmed in template-library) -- used explicitly here as a standalone
# step instead, to keep destinations/weights visible and match the explicit
# style of the Rolling group.
#
# Shares the input-set-V1/V2 naming with canary-istio-checkrouting/ per the
# legacy ticket text -- <needsSetup> confirm that reuse is intentional, not
# copy-paste, before treating both as validated once infra lands.
#
# TWO RUNS: run 1 EXPECT_VERSION=v1 (weights below); run 2 flip EXPECT_VERSION
# to v2 and weights to v1=0/v2=100. Same edit-and-re-run substitution as
# rolling-istio-checkrouting/ (no <+input> equivalent; see ../README.md).
#
# BEFORE RUNNING: git push, create ../service.yaml, Blue-Green-capable K8s
# Direct infra in an Istio-installed cluster (istio-injection=enabled on the
# namespace). Fill in every <YOUR_...>.
#
# RETRY NOTE (2026-09-24): first real attempt failed -- k8sBlueGreenDeployStep
# needs Harness's own blue/green color convention, incompatible with this
# suite's fixed v1/v2 manifest naming (see EXECUTION_LOG.md). New fixture at
# ../manifests/bluegreen/ (deployment.yaml + service.yaml, `${harnessColor}`
# templated, single Service `trafficshift-bg`) built to retry this --
# UNVERIFIED against the CD Unified plugin, fix from whatever the next real
# error says. Requires a NEW Harness Service pointing at
# manifests/bluegreen/ (not service_kubernetes_8f4a, which is v1/v2-based).
#
# DESIGN CHANGE from the v1/v2 model: BG has only ONE routable Service name
# (`trafficshift-bg`) whose selector Harness itself swaps between colors on
# cutover -- there's no second named backend to weight-split traffic against
# the way trafficshift-v1/trafficshift-v2 worked for Rolling. So the
# standalone k8sTrafficRoutingStep (0/100 weight split) doesn't apply here
# and has been REMOVED below. Verification instead curls the primary
# Service directly, before and after `bgDeploy`, to confirm the actual pod
# behind it changed (http-echo text v1 -> v2) -- same "real resource
# mutated" signal, just via BG's own Service-selector-swap mechanism
# instead of an Istio VS. Re-add a routing step only if a real run shows
# BG's `traffic_shift: true` built-in option is needed/wanted instead.
#
# CONFIRMED via Studio step picker (2026-09-24): no separate "swap"/
# "promote" step exists -- `k8sBlueGreenDeployStep` is the only BG-related
# step, and it uses the `deploy:` key (same as k8sTrafficRoutingStep), not
# `template:`. `traffic_shift` left `false` here since we're using BG's own
# Service-selector-swap mechanism (see DESIGN CHANGE note above), not its
# built-in Istio-VS traffic-shift option.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-T15817 bluegreen istio config-and-checkrouting
      id: cds_t15817
      service: <YOUR_SERVICE_ID>
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:
        - name: Blue-Green Deploy
          id: bgDeploy
          deploy:
            uses: k8sBlueGreenDeployStep
            with:
              traffic_shift: true
              skip_dry_run: false
              pruning: false
              skip_unchanged_manifest: false
              manifests: ${{runtime.manifestPath}}
              kubeconfig: ${{infra.kube_config_path}}
              namespace: ${{infra.namespace}}
              release: ${{infra.releaseName}}
              apply_timeout: 5m
              log_level: info
              skip_resource_versioning: false
              print_manifests: false
              server_side_apply: false
              skip_steady_state_check: false
              steady_state_timeout: 5m
              describe_resources: false

        # --- REQUIRED_VALUES (run 1 shown: deploy v1 as the -text arg in
        # ../manifests/bluegreen/deployment.yaml; edit to v2 for run 2) ------
        - name: verify BG deploy reaches expected version
          id: verifyRouting
          run:
            container:
              image: curlimages/curl
              connector: account.harnessImage
            shell: sh
            env:
              EXPECT_VERSION: v1
            script: |-
              set -e
              for i in 1 2 3 4 5; do
                got=$(curl -s --max-time 5 http://trafficshift-bg.<YOUR_ISTIO_NAMESPACE>.svc.cluster.local/)
                echo "attempt $i: got '$got', expect '$EXPECT_VERSION'"
                if [ "$got" = "$EXPECT_VERSION" ]; then
                  echo "PASS: BG deploy serving $EXPECT_VERSION"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: never observed $EXPECT_VERSION"
              exit 1
        # --- end REQUIRED_VALUES -------------------------------------------

      runtime:
        kubernetes:
          namespace: <YOUR_ISTIO_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 15m
