# CDS-T15817 -- Blue-Green deploy + K8sTrafficRoutingConfig (Istio), then
# live routing verification, executed TWICE (pinned to v1, then v2).
# Legacy status: @Ignore("corrupted Istio setup") -- this scenario has never
# actually passed in the legacy suite either; the Istio infra it needs is
# documented broken independent of the general blocker in ../README.md.
#
# Distinct mechanics from Rolling: BG is a single all-or-nothing 0/100
# cutover (one Config step, no Inherit) rather than a two-step chain.
# k8sBlueGreenDeployStep has a built-in `traffic_shift: true` option that
# internally calls the same action with config_type hardcoded to `new`
# (confirmed in template-library) -- used explicitly here as a standalone
# step instead, to keep destinations/weights visible and match the explicit
# style of the Rolling group.
#
# Shares the input-set-V1/V2 naming with canary-istio-checkrouting/ per the
# legacy ticket text -- <needsSetup> confirm that reuse is intentional, not
# copy-paste, before treating both as validated once infra lands.
#
# TWO RUNS: run 1 EXPECT_VERSION=v1 (weights below); run 2 flip EXPECT_VERSION
# to v2 and weights to v1=0/v2=100. Same edit-and-re-run substitution as
# rolling-istio-checkrouting/ (no <+input> equivalent; see ../README.md).
#
# BEFORE RUNNING: git push, create ../service.yaml, Blue-Green-capable K8s
# Direct infra in an Istio-installed cluster (istio-injection=enabled on the
# namespace). Fill in every <YOUR_...>.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-T15817 bluegreen istio config-and-checkrouting
      id: cds_t15817
      service: <YOUR_SERVICE_ID>
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:
        - name: Blue-Green Deploy
          id: bgDeploy
          template:
            uses: k8sBlueGreenDeployStep

        # --- REQUIRED_VALUES (run 1 shown; edit for run 2) ----------------
        - name: Traffic Routing Config (Istio, BG cutover)
          id: trConfig
          template:
            uses: k8sTrafficRoutingStep
            with:
              config_type: new
              provider: istio
              resource_name: trafficshift-vs
              hosts:
                - trafficshift
              routes:
                - type: http
                  name: route1
                  destinations:
                    - host: trafficshift-v1
                      weight: 100
                    - host: trafficshift-v2
                      weight: 0

        - name: verify BG cutover reaches expected version
          id: verifyRouting
          run:
            container:
              image: curlimages/curl
              connector: account.harnessImage
            shell: sh
            env:
              EXPECT_VERSION: v1
            script: |-
              set -e
              for i in 1 2 3 4 5; do
                got=$(curl -s --max-time 5 http://trafficshift.<YOUR_ISTIO_NAMESPACE>.svc.cluster.local/)
                echo "attempt $i: got '$got', expect '$EXPECT_VERSION'"
                if [ "$got" = "$EXPECT_VERSION" ]; then
                  echo "PASS: BG cutover routed to $EXPECT_VERSION"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: never observed $EXPECT_VERSION"
              exit 1
        # --- end REQUIRED_VALUES -------------------------------------------

      runtime:
        kubernetes:
          namespace: <YOUR_ISTIO_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 15m
