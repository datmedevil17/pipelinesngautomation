pipeline:
  clone:
    disabled: true
  inputs:
    responseText:
      type: string
      value: v1
    trafficGeneratorSleepTimer:
      type: number
      value: 1
  stages:
  - name: Deploy
    id: stage1
    inputs:
      resourceNamePrefix:
        type: string
        value: sample-k8s-ameb
    service:
      type: kubernetes
      items:
      - id: service_kubernetes_cb2f
    environment:
      items:
      - id: environment_env_2a02
        deploy-to: infrastructure_kubernetes_5a5e
    steps:
    - name: PreCleanup
      id: PreCleanup
      deploy:
        uses: k8sDeleteStep
        with:
          select_delete_resources: resources
          resources:
          - <+infra.namespace>/Deployment/${{stage.inputs.resourceNamePrefix}}
          - <+infra.namespace>/Service/${{stage.inputs.resourceNamePrefix}}-svc
          - <+infra.namespace>/Service/${{stage.inputs.resourceNamePrefix}}-svc-stage
          - <+infra.namespace>/VirtualService/${{stage.inputs.resourceNamePrefix}}-vs-a
          - <+infra.namespace>/VirtualService/${{stage.inputs.resourceNamePrefix}}-vs-b
          - <+infra.namespace>/HTTPRoute/${{stage.inputs.resourceNamePrefix}}-route
      timeout: 15m
    - name: BlueGreenDeployment
      id: BlueGreenDeployment
      deploy:
        uses: k8sBlueGreenDeployStep
        with:
          kubeconfig: <+infrastructure.PLUGIN_HARNESS_KUBE_CONFIG_PATH>
          namespace: <+infra.namespace>
          release: releasename-135487a
          skip_dry_run: false
          pruning: false
          skip_unchanged_manifest: false
          traffic_shift: false
      timeout: 15m
    - name: Snapshot before swap
      id: snapBefore
      run:
        container:
          image: bitnami/kubectl
          connector: account.harnessImage
          pull: if-not-exists
        shell: bash
        script: |-
          export KUBECONFIG=${{infra.PLUGIN_HARNESS_KUBE_CONFIG_PATH}}
          P=${{stage.inputs.resourceNamePrefix}}
          NS=<+infra.namespace>
          echo "stage selector before: $(kubectl get svc $P-svc-stage -n $NS -o jsonpath='{.spec.selector}')"
          echo "primary selector before: $(kubectl get svc $P-svc -n $NS -o jsonpath='{.spec.selector}')"
          for v in vs-a vs-b; do echo "$v generation before: $(kubectl get vs $P-$v -n $NS -o jsonpath='{.metadata.generation}') weights: $(kubectl get vs $P-$v -n $NS -o jsonpath='{range .spec.http[*]}{.name}{"="}{range .route[*]}{.destination.host}{":"}{.weight}{","}{end}{" "}{end}')"; done
      timeout: 15m
    - name: Swap primary with stage service
      id: BgSwapServices
      deploy:
        uses: k8sBlueGreenSwapServicesSelectorsStep
        with:
          kubeconfig: <+infrastructure.PLUGIN_HARNESS_KUBE_CONFIG_PATH>
          namespace: <+infra.namespace>
          stable_service: ${{stage.steps.BlueGreenDeployment.output.outputVariables.stableService}}
          stage_service: ${{stage.steps.BlueGreenDeployment.output.outputVariables.stageService}}
          is_openshift: ${{stage.steps.BlueGreenDeployment.output.outputVariables.isOpenshift}}
          release: releasename-135487a
          skip_dry_run: false
      timeout: 15m
    - name: Validate swap without traffic shift
      id: validateSwap
      run:
        container:
          image: bitnami/kubectl
          connector: account.harnessImage
          pull: if-not-exists
        shell: bash
        script: |-
          export KUBECONFIG=${{infra.PLUGIN_HARNESS_KUBE_CONFIG_PATH}}
          P=${{stage.inputs.resourceNamePrefix}}
          NS=<+infra.namespace>
          FAILED=0
          PRI=$(kubectl get svc $P-svc -n $NS -o jsonpath='{.spec.selector.harness\.io/color}')
          STG=$(kubectl get svc $P-svc-stage -n $NS -o jsonpath='{.spec.selector.harness\.io/color}')
          echo "primary color=$PRI stage color=$STG"
          if [ -n "$PRI" ] && [ -n "$STG" ] && [ "$PRI" != "$STG" ]; then echo "PASS: selectors differ (swapped)"; else echo "FAIL: selectors not swapped/distinct"; FAILED=1; fi
          for v in vs-a vs-b; do
            gen=$(kubectl get vs $P-$v -n $NS -o jsonpath='{.metadata.generation}')
            w=$(kubectl get vs $P-$v -n $NS -o jsonpath='{range .spec.http[*]}{.name}{"="}{range .route[*]}{.destination.host}{":"}{.weight}{","}{end}{" "}{end}')
            echo "$v generation after: $gen weights: $w"
            if [ "$gen" = "1" ]; then echo "PASS: $v spec untouched by swap"; else echo "FAIL: $v spec changed (generation $gen)"; FAILED=1; fi
          done
          [ $FAILED -eq 0 ] || exit 1
      timeout: 15m
    - name: Cleanup
      id: Cleanup
      deploy:
        uses: k8sDeleteStep
        with:
          select_delete_resources: release_name
          release: releasename-135487a
      timeout: 15m
    on-failure:
      errors: all
      action: stage-rollback
    runtime:
      kubernetes:
        namespace: default
        connector: local_rancher_cluster
        automount-service-token: true
        pull: always
    timeout: 15m
