# CDS-T15816 -- REFRAMED (see ../README.md: no SMI provider in the current
# plugin). Legacy: Blue-Green + SMI TrafficSplit cutover + checkrouting,
# executed twice (v1/v2). Legacy status: @Test(enabled=false), SMI infra
# issue -- same blocker as the Rolling SMI scenarios.
#
# Ported as `k8s-native` (Gateway API HTTPRoute) instead of a literal SMI
# port. Same structure as bluegreen-istio-checkrouting/: one Config step
# (BG's 0/100 cutover, no Inherit), then live routing verification, run
# twice pinned to v1 then v2.
#
# <needsSetup> same Gateway API prerequisite as the rolling-k8snative-*
# folders: a `trafficshift-gateway` Gateway resource must pre-exist in the
# namespace before the HTTPRoute this step creates can attach to it.
#
# REUSES the BG fixture built for bluegreen-istio-checkrouting/ (T15817):
# service_kubernetes_675d_bg, manifests at ../manifests/bluegreen/
# (${harnessColor}-templated Deployment + primary Service `trafficshift-bg`).
# k8sBlueGreenDeployStep auto-creates `trafficshift-bg-stage` alongside it
# (confirmed real in T15817) -- same two real Service names used as the
# routing destinations below.
#
# GATEWAY API CAVEAT (real, not carried over from the Istio version): a
# Gateway API HTTPRoute only intercepts traffic that arrives through its
# parent Gateway's own listener/IP -- unlike Istio's mesh-wide VirtualService,
# it does NOT intercept plain internal Service DNS lookups
# (`*.svc.cluster.local`). The Istio version's verify script (curl an
# internal Service DNS name) would silently bypass the HTTPRoute entirely
# here and just hit whatever the literal Service's own selector points to.
# Fixed below: curl the Gateway's own LB address with an explicit `Host:`
# header matching the HTTPRoute's `hostnames` entry. Confirmed real LB
# address: `kubectl get gateway trafficshift-gateway -n <namespace> -o
# jsonpath='{.status.addresses[0].value}'` -- re-check before running, it can
# change if the Gateway/LB is ever recreated.
#
# TWO RUNS: run 1 EXPECT_VERSION=v1 (weights below); run 2 flip EXPECT_VERSION
# to v2 and weights to v1=0/v2=100 -- requires re-running bgDeploy against a
# `-text=v2` edit of ../manifests/bluegreen/deployment.yaml first (same
# convention as T15817 run 2, not yet executed there either).
#
# BEFORE RUNNING: git push. Fill in every <YOUR_...>.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-T15816 bluegreen k8s-native config-and-checkrouting
      id: cds_t15816
      service: service_kubernetes_675d_bg
      environment:
        id: environment_env_a193
        deploy-to: <YOUR_INFRA_ID>
      steps:
        - name: Blue-Green Deploy
          id: bgDeploy
          deploy:
            uses: k8sBlueGreenDeployStep
            with:
              traffic_shift: false
              skip_dry_run: false
              pruning: false
              skip_unchanged_manifest: false
              manifests: ${{runtime.manifestPath}}
              kubeconfig: ${{infra.kube_config_path}}
              namespace: ${{infra.namespace}}
              release: ${{infra.releaseName}}
              apply_timeout: 5m
              log_level: info
              skip_resource_versioning: false
              print_manifests: false
              server_side_apply: false
              skip_steady_state_check: false
              steady_state_timeout: 5m
              describe_resources: false

        # --- REQUIRED_VALUES (run 1 shown; edit for run 2) ----------------
        - name: Traffic Routing Config (k8s-native, BG cutover)
          id: trConfig
          deploy:
            uses: k8sTrafficRoutingStep
            with:
              config_type: new
              provider: k8s-native
              resource_name: trafficshift-bg-route
              hosts:
                - trafficshift-bg
              gateways:
                - trafficshift-gateway
              routes:
                - type: http
                  name: route1
                  destinations:
                    - host: trafficshift-bg
                      weight: 0
                    - host: trafficshift-bg-stage
                      weight: 100

        - name: verify BG cutover reaches expected version
          id: verifyRouting
          run:
            container:
              image: curlimages/curl
              connector: account.harnessImage
            shell: sh
            env:
              EXPECT_VERSION: v1
              GATEWAY_ADDR: 136.109.237.207
            script: |-
              set -e
              for i in 1 2 3 4 5; do
                got=$(curl -s --max-time 5 -H "Host: trafficshift-bg" http://$GATEWAY_ADDR/)
                echo "attempt $i: got '$got', expect '$EXPECT_VERSION'"
                if [ "$got" = "$EXPECT_VERSION" ]; then
                  echo "PASS: BG cutover routed to $EXPECT_VERSION"
                  exit 0
                fi
                sleep 2
              done
              echo "FAIL: never observed $EXPECT_VERSION"
              exit 1
        # --- end REQUIRED_VALUES -------------------------------------------

      runtime:
        kubernetes:
          namespace: traffic-shift-demo
          connector: connector_K8sCluster_a7ec
          automount-service-token: true
          pull: always
      timeout: 15m
