# CDS-T15818 -- REFRAMED (see ../README.md: no SMI provider in the current
# plugin). Legacy: Canary + SMI TrafficSplit partial-split checkrouting,
# executed twice. Legacy status: @Test(enabled=false), marked "//failure" in
# a code comment even BEFORE the SMI infra was deleted -- this is the
# least-proven case in the whole matrix. Treat any pass here as new
# evidence, not a restored known-good result; do not assume it will pass
# once ported.
#
# <needsSetup> legacy also reuses the ISTIO-named input sets for this SMI
# scenario (K8S_BG_CANARY_TRAFFIC_ROUTING_ISTIO_..._V1/V2_YAML) --
# unresolved whether that cross-provider reuse was intentional or a
# copy-paste bug; carrying the same open flag forward here rather than
# silently picking one interpretation.
#
# Same structure as canary-istio-checkrouting/ (percentage split + sampled
# verification), ported to k8s-native provider. Same Gateway API
# prerequisite as the other k8s-native folders: `trafficshift-gateway`
# Gateway resource must pre-exist in the namespace.
#
# TWO RUNS: run 1 = canary at 20% (v1=80/v2=20, shown below); run 2 =
# promote further and re-run.
#
# BEFORE RUNNING: git push, create ../service.yaml, Canary-capable K8s
# Direct infra in a cluster with Gateway API CRDs + a `trafficshift-gateway`
# Gateway already applied in the target namespace. Fill in every <YOUR_...>.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-T15818 canary k8s-native config-and-checkrouting
      id: cds_t15818
      service: <YOUR_SERVICE_ID>
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:
        - name: Canary Deploy
          id: canaryDeploy
          template:
            uses: k8sCanaryDeployStep

        # --- REQUIRED_VALUES (run 1 = 20% canary, shown; edit for run 2) --
        - name: Traffic Routing Config (k8s-native, canary split)
          id: trConfig
          template:
            uses: k8sTrafficRoutingStep
            with:
              config_type: new
              provider: k8s-native
              resource_name: trafficshift-route
              hosts:
                - trafficshift
              gateways:
                - trafficshift-gateway
              routes:
                - type: http
                  name: route1
                  destinations:
                    - host: trafficshift-v1
                      weight: 80
                    - host: trafficshift-v2
                      weight: 20

        - name: verify canary split observed on the route
          id: verifyRouting
          run:
            container:
              image: curlimages/curl
              connector: account.harnessImage
            shell: sh
            env:
              EXPECT_V2_MIN_PCT: "5"
              EXPECT_V2_MAX_PCT: "40"
              SAMPLES: "50"
            script: |-
              set -e
              v2=0
              i=0
              while [ "$i" -lt "$SAMPLES" ]; do
                got=$(curl -s --max-time 5 http://trafficshift.<YOUR_GATEWAY_NAMESPACE>.svc.cluster.local/)
                if [ "$got" = "v2" ]; then v2=$((v2 + 1)); fi
                i=$((i + 1))
              done
              pct=$((v2 * 100 / SAMPLES))
              echo "observed v2 in $v2/$SAMPLES samples (${pct}%)"
              if [ "$pct" -ge "$EXPECT_V2_MIN_PCT" ] && [ "$pct" -le "$EXPECT_V2_MAX_PCT" ]; then
                echo "PASS: canary split within expected range"
              else
                echo "FAIL: split outside expected [$EXPECT_V2_MIN_PCT, $EXPECT_V2_MAX_PCT]%"
                exit 1
              fi
        # --- end REQUIRED_VALUES -------------------------------------------

      runtime:
        kubernetes:
          namespace: <YOUR_GATEWAY_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 15m
