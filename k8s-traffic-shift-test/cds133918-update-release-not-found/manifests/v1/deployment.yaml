apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsrefkqvqf-trafficshift-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsrefkqvqf-trafficshift
      version: v1
  template:
    metadata:
      labels:
        app: tsrefkqvqf-trafficshift
        version: v1
    spec:
      containers:
        - name: trafficshift
          image: hashicorp/http-echo:latest
          args:
            - -text=v1
            - -listen=:5000
          ports:
            - containerPort: 5000
