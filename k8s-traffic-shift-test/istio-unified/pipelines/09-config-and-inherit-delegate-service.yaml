pipeline:
  clone:
    disabled: true
  stages:
    - name: Deploy
      id: stage1
      inputs:
        resourceNamePrefix:
          type: string
          value: tsistio-cfgds
      service:
        type: kubernetes
        items:
          - tsistioplain
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      steps:
        - name: PreCleanup
          id: PreCleanup
          deploy:
            uses: k8sDeleteStep
            with:
              select_delete_resources: resources
              resources:
                - <+infra.namespace>/VirtualService/vs-tsistioplain
          timeout: 15m
        - name: config
          id: K8sTrafficRoutingConfig
          deploy:
            uses: k8sTrafficRoutingStep
            with:
              config_type: new
              provider: istio
              resource_name: vs-tsistioplain
              delegate_service: true
              kubeconfig: <+infrastructure.PLUGIN_HARNESS_KUBE_CONFIG_PATH>
              namespace: <+infra.namespace>
              release: releasename-310009
              routes:
                - type: http
                  name: route1
                  matches:
                    - uri:
                        type: prefix
                        value: /login
                    - method:
                        value: GET
                    - scheme:
                        type: prefix
                        value: http
                    - authority:
                        type: exact
                        value: test.com
                    - port:
                        value: 8080
                    - headers:
                        - key: X-Request
                          type: prefix
                          value: req
                        - key: user-agent
                          type: regex
                          value: .*Android.*
                        - key: Authorization
                          type: exact
                          value: ""
                  destinations:
                    - host: svc1
                      weight: 65
                      port: 80
                    - host: svc2
                    - host: svc3
                - type: http
                  name: route2
                  matches:
                    - uri:
                        value: /register
                  destinations:
                    - host: svc1
                    - host: svc2
                    - host: svc3
          timeout: 15m
        - name: validate Hosts
          id: verifyResourcesExist
          run:
            container:
              image: bitnami/kubectl
              connector: account.harnessImage
              pull: if-not-exists
            shell: bash
            script: |-
              export KUBECONFIG=${{infra.PLUGIN_HARNESS_KUBE_CONFIG_PATH}}

              if ! kubectl get virtualservice/vs-tsistioplain -n <+infra.namespace> -o yaml; then
                echo "FAIL: VirtualService vs-tsistioplain not found"
                exit 1
              fi
              echo "------------------------------------------"

              HOSTS=$(kubectl get virtualservice/vs-tsistioplain -n <+infra.namespace> -o jsonpath='{.spec.hosts[*]}')
              if [ -z "$HOSTS" ]; then
                echo "PASS: spec.hosts is empty"
              else
                echo "FAIL: spec.hosts is not empty: $HOSTS"
                exit 1
              fi

              PORTS=$(kubectl get virtualservice/vs-tsistioplain -n <+infra.namespace> -o jsonpath='{range .spec.http[*].route[*]}{.destination.port.number}{"\n"}{end}')
              echo "destination ports: $PORTS"
              if echo "$PORTS" | grep -q "^80$"; then
                echo "PASS: destination port number is 80"
              else
                echo "FAIL: destination port number 80 not found"
                exit 1
              fi
          timeout: 15m
        - name: inherit
          id: K8sTrafficRoutingInherit
          deploy:
            uses: k8sTrafficRoutingStep
            with:
              config_type: update
              provider: istio
              resource_name: vs-tsistioplain
              kubeconfig: <+infrastructure.PLUGIN_HARNESS_KUBE_CONFIG_PATH>
              namespace: <+infra.namespace>
              release: releasename-310009
              routes:
                - type: http
                  name: route1
                  destinations:
                    - host: svc2
                      weight: 60
          timeout: 15m
        - name: validate hosts in inherit
          id: verifyWeightsForRoutesAfterInheritStep
          run:
            container:
              image: bitnami/kubectl
              connector: account.harnessImage
              pull: if-not-exists
            shell: bash
            script: |-
              export KUBECONFIG=${{infra.PLUGIN_HARNESS_KUBE_CONFIG_PATH}}

              if ! kubectl get virtualservice/vs-tsistioplain -n <+infra.namespace> -o yaml; then
                echo "FAIL: VirtualService vs-tsistioplain not found"
                exit 1
              fi
              echo "------------------------------------------"

              HOSTS=$(kubectl get virtualservice/vs-tsistioplain -n <+infra.namespace> -o jsonpath='{.spec.hosts[*]}')
              if [ -z "$HOSTS" ]; then
                echo "PASS: spec.hosts is empty"
              else
                echo "FAIL: spec.hosts is not empty: $HOSTS"
                exit 1
              fi

              routes=$(kubectl get virtualservice vs-tsistioplain -n <+infra.namespace> -o jsonpath='{range .spec.http[*]}{.name}{"|"}{range .route[*]}{.destination.host}{"="}{.weight}{","}{end}{"\n"}{end}')
              if [ $? -ne 0 ] || [ -z "$routes" ]; then
                echo "FAIL: VirtualService vs-tsistioplain not found or has no http routes"
                exit 1
              fi
              echo "$routes"

              FAILED=0
              # route names may be emitted as-is or prefixed with the resource name (<resource>-<route>)
              check() {
                r=$1; shift
                line=$(echo "$routes" | awk -F'|' -v r="$r" '$1==r || $1 ~ ("-" r "$") {print; exit}')
                if [ -z "$line" ]; then echo "FAIL: route $r not found"; FAILED=1; return; fi
                for hw in "$@"; do
                  case ",${line#*|}" in
                    *",$hw,"*) echo "PASS: $r $hw" ;;
                    *) echo "FAIL: $r expected $hw, got ${line#*|}"; FAILED=1 ;;
                  esac
                done
              }
              check route1 svc2=60
              [ $FAILED -eq 0 ] || exit 1
          timeout: 15m
        - name: DeleteTrafficRoutingResources
          id: DeleteTrafficRoutingResources
          deploy:
            uses: k8sDeleteStep
            with:
              select_delete_resources: resources
              resources:
                - <+infra.namespace>/VirtualService/vs-tsistioplain
          timeout: 15m
      rollback:
        - name: RollbackDelete
          id: RollbackDelete
          deploy:
            uses: k8sDeleteStep
            with:
              select_delete_resources: release_name
              release: releasename-310009
          timeout: 15m
        - name: RollbackDeleteResources
          id: RollbackDeleteResources
          deploy:
            uses: k8sDeleteStep
            with:
              select_delete_resources: resources
              resources:
                - <+infra.namespace>/VirtualService/vs-tsistioplain
          timeout: 15m
      on-failure:
        errors: all
        action: stage-rollback
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
          automount-service-token: true
          pull: always
      timeout: 15m
