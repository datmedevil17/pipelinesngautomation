apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}-svc
  annotations:
    harness.io/primary-service: "true"
spec:
  selector:
    app: {{.Values.name}}
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}-svc-stage
  annotations:
    harness.io/stage-service: "true"
spec:
  selector:
    app: {{.Values.name}}
  ports:
    - name: http
      port: 80
      targetPort: 5678
