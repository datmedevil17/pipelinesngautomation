# CDS-T15819 -- Canary deploy + K8sTrafficRoutingConfig (Istio), then live
# routing verification, executed TWICE (pinned to v1, then v2). Legacy
# status: @Ignore("corrupted Istio setup") -- never actually passed in the
# legacy suite either, same documented-broken Istio infra as T15817.
#
# Distinct mechanics from both Rolling (no shift) and BG (0/100 cutover):
# Canary is a PARTIAL split -- some percentage of traffic goes to the new
# version while the rest stays on the stable one. Verification here samples
# the route repeatedly and checks the observed split falls in the expected
# range, instead of a single curl's exact match (see rolling/bluegreen
# checkrouting folders).
#
# Reuses the BG scenario's input-set naming per the legacy ticket text
# (K8S_BG_CANARY_TRAFFIC_ROUTING_ISTIO_..._V1/V2_YAML) -- <needsSetup>
# confirm this cross-strategy reuse is intentional before assuming both
# pass identically once ported.
#
# TWO RUNS: run 1 = canary at 20% (v1=80/v2=20, shown below); run 2 =
# promote further, e.g. v1=0/v2=100, or any other split -- edit and re-run
# (same substitution as every other checkrouting/runtime-input folder here;
# see ../README.md).
#
# BEFORE RUNNING: git push, create ../service.yaml, Canary-capable K8s
# Direct infra in an Istio-installed cluster (istio-injection=enabled).
# Fill in every <YOUR_...>.

pipeline:
  clone:
    disabled: true

  stages:
    - name: CDS-T15819 canary istio config-and-checkrouting
      id: cds_t15819
      service: <YOUR_SERVICE_ID>
      environment:
        id: <YOUR_ENV_ID>
        deploy-to: <YOUR_INFRA_ID>
      steps:
        - name: Canary Deploy
          id: canaryDeploy
          template:
            uses: k8sCanaryDeployStep

        # --- REQUIRED_VALUES (run 1 = 20% canary, shown; edit for run 2) --
        - name: Traffic Routing Config (Istio, canary split)
          id: trConfig
          template:
            uses: k8sTrafficRoutingStep
            with:
              config_type: new
              provider: istio
              resource_name: trafficshift-vs
              hosts:
                - trafficshift
              routes:
                - type: http
                  name: route1
                  destinations:
                    - host: trafficshift-v1
                      weight: 80
                    - host: trafficshift-v2
                      weight: 20

        - name: verify canary split observed on the route
          id: verifyRouting
          run:
            container:
              image: curlimages/curl
              connector: account.harnessImage
            shell: sh
            env:
              EXPECT_V2_MIN_PCT: "5"
              EXPECT_V2_MAX_PCT: "40"
              SAMPLES: "50"
            script: |-
              set -e
              v2=0
              i=0
              while [ "$i" -lt "$SAMPLES" ]; do
                got=$(curl -s --max-time 5 http://trafficshift.<YOUR_ISTIO_NAMESPACE>.svc.cluster.local/)
                if [ "$got" = "v2" ]; then v2=$((v2 + 1)); fi
                i=$((i + 1))
              done
              pct=$((v2 * 100 / SAMPLES))
              echo "observed v2 in $v2/$SAMPLES samples (${pct}%)"
              if [ "$pct" -ge "$EXPECT_V2_MIN_PCT" ] && [ "$pct" -le "$EXPECT_V2_MAX_PCT" ]; then
                echo "PASS: canary split within expected range"
              else
                echo "FAIL: split outside expected [$EXPECT_V2_MIN_PCT, $EXPECT_V2_MAX_PCT]%"
                exit 1
              fi
        # --- end REQUIRED_VALUES -------------------------------------------

      runtime:
        kubernetes:
          namespace: <YOUR_ISTIO_NAMESPACE>
          connector: <YOUR_K8S_CONNECTOR>
          automount-service-token: true
          pull: always
      timeout: 15m
