# This run shows: an invalid env with all-infra fails on the Infrastructure node under the environment rule, not on the parent or the Service node
pipeline:
  stages:
    - name: all-infra-invalid-env
      id: all_infra_invalid_env
      steps:
        - name: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: test_127344_docker
          id: Deploy
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      service:
        items:
          - service_kubernetes_k8s_shift_repro
        type: kubernetes
        on-failure:
          - errors: [unknown]
            action: fail
      environment:
        items:
          - id: INVALID_ENV_ID
            all-infra: true
        on-failure:
          - errors: [unknown]
            action: abort
