# This run shows: multi-deployment.if true lets the block run; max-concurrency 1 and run-all are applied to both service deployments.
pipeline:
  stages:
    - name: multi-deployment-if-true
      id: multi_deployment_if_true
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying <+service.identifier>
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      multi-deployment:
        if: <+pipeline.name> != "never"
        max-concurrency: 1
        on-failure: run-all
      service:
        items:
          - service_kubernetes_k8s_shift_repro
          - service_kubernetes_bg_traffic_shift
        type: kubernetes
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
