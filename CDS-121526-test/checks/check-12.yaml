# This run shows: multi-deployment.if, on-failure and max-concurrency can all be runtime inputs; the run decides whether the block runs.
pipeline:
  stages:
    - name: md-if-runtime-input
      id: md_if_runtime_input
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying <+service.identifier>
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      multi-deployment:
        if: <+input>
        on-failure: <+input>.allowedValues(run-all,skip-queued)
        max-concurrency: <+input>
      service:
        parallel: false
        items:
          - service_kubernetes_k8s_shift_repro
          - INVALID_SERVICE_ID
          - service_kubernetes_bg_traffic_shift
        type: kubernetes
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
