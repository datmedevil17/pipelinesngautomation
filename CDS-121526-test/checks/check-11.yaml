# This run shows: with multi-deployment.if true and skip-queued, the invalid service fails and the queued deployment after it is skipped.
pipeline:
  stages:
    - name: md-if-true-skip-queued
      id: md_if_true_skip_queued
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying <+service.identifier>
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      multi-deployment:
        if: <+pipeline.name> != "never"
        on-failure: skip-queued
        max-concurrency: 1
      service:
        parallel: false
        items:
          - service_kubernetes_k8s_shift_repro
          - INVALID_SERVICE_ID
          - service_kubernetes_bg_traffic_shift
        type: kubernetes
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
