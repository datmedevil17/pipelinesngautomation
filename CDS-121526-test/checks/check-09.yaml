# This run shows: multi-deployment.if false skips the whole block even when on-failure (run-all) and max-concurrency are set; the failure options only matter once the block runs.
pipeline:
  stages:
    - name: multi-deployment-if-false-with-options
      id: multi_deployment_if_false_with_options
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying <+service.identifier>
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      multi-deployment:
        if: <+pipeline.name> == "never"
        on-failure: run-all
        max-concurrency: 1
      service:
        items:
          - service_kubernetes_k8s_shift_repro
          - service_kubernetes_bg_traffic_shift
        type: kubernetes
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
