pipeline:
  stages:
    - name: Environment Allows Stage Rollback
      id: Environment_Allows_Stage_Rollback
      steps:
        - name: Deploy
          run:
            script: echo "deploying"
          id: Deploy
      runtime: cloud
      service:
        parallel: false
        items:
          - service_kubernetes_c0ae
        type: kubernetes
      environment:
        parallel: false
        items:
          - id: INTENTIONALLY_INVALID_ENVIRONMENT_ID
            all-infra: true
        on-failure:
          - errors:
              - unknown
            action: stage-rollback
# Companion to pipeline-service-disallowed-action-rejected.yaml. Same
# `action: stage-rollback` config, moved to environment scope with a VALID
# service and an INVALID environment ID instead. Environment scope's allow
# list includes StageRollback (unlike service scope), so this must plan and
# execute successfully -- expect the stage to end "Failed" after a rollback
# attempt is visible in the execution graph (StageRollback runs the stage's
# `rollback:` steps, if any; this fixture has none, so an empty/no-op
# rollback is fine, the point is that plan-creation did NOT throw). If this
# pipeline fails at plan-creation instead of executing, the two allow-lists
# are not actually distinct.
