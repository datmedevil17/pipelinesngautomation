pipeline:
  stages:
    - name: Multi Deployment Run All
      id: Multi_Deployment_Run_All
      steps:
        - name: Deploy
          run:
            script: echo "deploying"
          id: Deploy
      runtime: cloud
      service:
        parallel: false
        items:
          - service_kubernetes_0b82
          - INTENTIONALLY_INVALID_SERVICE_ID
          - service_kubernetes_c0ae
        type: kubernetes
      multi-deployment:
        on-failure: run-all
        max-concurrency: 1
      environment:
        parallel: false
        items:
          - id: environment_env_2a02
            all-infra: true
