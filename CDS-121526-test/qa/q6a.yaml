# QA 6a: skip-queued with parallel + max-concurrency 2; the first deployment fails, the queued ones are skipped, the running one finishes.
pipeline:
  stages:
    - name: q6a_skip_queued_parallel
      id: q6a_skip_queued_parallel
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo START <+service.identifier> $(date +%T); sleep 25; echo END <+service.identifier> $(date +%T)
            container:
              image: alpine
              connector: account.harnessImage
      runtime:
        kubernetes:
          namespace: default
          connector: account.cdautomationtest
      service:
        items:
          - INVALID_SERVICE_ID
          - service_kubernetes_675d_bg
          - service_kubernetes_update_release_k8s_traffic
          - service_kubernetes_8f4a
        type: kubernetes
        parallel: true
      multi-deployment:
        on-failure: skip-queued
        max-concurrency: 2
      environment:
        items:
          - id: environment_env_a193
            deploy-to: infrastructure_kubernetes_k8s_traffic_shift
