# QA 7c.2: service on-failure fail + environment on-failure abort on the same stage; each scope uses its own rule (invalid service -> Failed, invalid infra -> Aborted).
pipeline:
  stages:
    - name: q7c2_service_and_env
      id: q7c2_service_and_env
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: account.harnessImage
      runtime:
        kubernetes:
          namespace: default
          connector: account.cdautomationtest
      service:
        items:
          - service_kubernetes_675d_bg
        type: kubernetes
        on-failure:
          - errors: [all]
            action: fail
      environment:
        items:
          - id: environment_env_a193
            deploy-to: INVALID_INFRA_ID
        on-failure:
          - errors: [all]
            action: abort
