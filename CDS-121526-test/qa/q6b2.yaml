# QA 6b: on-failure left out (default); max-concurrency 1 queues the rest behind the failing deployment - do they still run?
pipeline:
  stages:
    - name: q6b2_default_on_failure
      id: q6b2_default_on_failure
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying <+service.identifier>
            container:
              image: alpine
              connector: account.harnessImage
      runtime:
        kubernetes:
          namespace: default
          connector: account.cdautomationtest
      service:
        items:
          - INVALID_SERVICE_ID
          - service_kubernetes_675d_bg
          - service_kubernetes_update_release_k8s_traffic
        type: kubernetes
        parallel: true
      multi-deployment:
        on-failure: run-all
        max-concurrency: 1
      environment:
        items:
          - id: environment_env_a193
            deploy-to: infrastructure_kubernetes_k8s_traffic_shift
