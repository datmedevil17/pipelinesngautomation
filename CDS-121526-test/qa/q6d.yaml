# QA 6d: max-concurrency 2 caps three parallel deployments - only two run at a time.
pipeline:
  stages:
    - name: q6d_max_concurrency
      id: q6d_max_concurrency
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo START <+service.identifier> $(date +%T); sleep 25; echo END <+service.identifier> $(date +%T)
            container:
              image: alpine
              connector: account.harnessImage
      runtime:
        kubernetes:
          namespace: default
          connector: account.cdautomationtest
      service:
        items:
          - service_kubernetes_675d_bg
          - service_kubernetes_update_release_k8s_traffic
          - service_kubernetes_8f4a
        type: kubernetes
        parallel: true
      multi-deployment:
        on-failure: run-all
        max-concurrency: 2
      environment:
        items:
          - id: environment_env_a193
            deploy-to: infrastructure_kubernetes_k8s_traffic_shift
