# This run shows: multi-deployment skip-queued - one at a time; after the 2nd service fails, the queued 3rd service is skipped.
pipeline:
  stages:
    - name: skip-queued
      id: skip_queued
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      service:
        parallel: false
        items:
          - service_kubernetes_k8s_shift_repro
          - INVALID_SERVICE_ID
          - service_kubernetes_bg_traffic_shift
        type: kubernetes
      multi-deployment:
        on-failure: skip-queued
        max-concurrency: 1
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
