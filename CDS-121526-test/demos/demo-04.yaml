# This run shows: fallback to the stage rule - the service rule only covers approval-rejection, so the stage stage-rollback runs the Undo step.
pipeline:
  stages:
    - name: stage-fallback
      id: stage_fallback
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      service:
        items:
          - INVALID_SERVICE_ID
        type: kubernetes
        on-failure:
          - errors: [approval-rejection]
            action: abort
      environment:
        items:
          - id: environment_env_2a02
            deploy-to: infrastructure_kubernetes_5a5e
      on-failure:
        - errors: [all]
          action: stage-rollback
      rollback:
        - name: Undo
          id: Undo
          run:
            script: echo ROLLBACK_RAN
            container:
              image: alpine
              connector: test_127344_docker
