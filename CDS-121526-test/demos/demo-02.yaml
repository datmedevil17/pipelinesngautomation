# This run shows: environment retry - an invalid environment is retried 3 times on the Infrastructure node, then aborts; the Service node succeeds.
pipeline:
  stages:
    - name: env-retry
      id: env_retry
      steps:
        - name: Deploy
          id: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: test_127344_docker
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      service:
        items:
          - service_kubernetes_k8s_shift_repro
        type: kubernetes
      environment:
        items:
          - id: INVALID_ENV_ID
            deploy-to: infrastructure_kubernetes_5a5e
        on-failure:
          - errors: [all]
            action:
              retry:
                attempts: 3
                interval: 10s
                failure-action: abort
