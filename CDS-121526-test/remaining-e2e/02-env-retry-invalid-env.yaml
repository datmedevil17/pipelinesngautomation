pipeline:
  stages:
    - name: R02 Env Retry
      id: R02_Env_Retry
      steps:
        - name: Deploy
          run:
            script: echo deploying
            container:
              image: alpine
              connector: test_127344_docker
          id: Deploy
      runtime:
        kubernetes:
          namespace: default
          connector: local_rancher_cluster
      service:
        items:
          - service_kubernetes_k8s_shift_repro
        type: kubernetes
      environment:
        items:
          - id: INVALID_ENV_ID
            deploy-to: infrastructure_kubernetes_5a5e
        on-failure:
          - errors: [unknown]
            action:
              retry:
                attempts: 2
                interval: 10s
                failure-action: fail
